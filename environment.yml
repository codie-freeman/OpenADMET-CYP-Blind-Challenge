  - pip:
      # --- let-resolve packages, now PINNED to what was actually confirmed
      # installed and working in cyp-admet-v2-test (native osx-arm64), rather
      # than left loose -- this file is meant to be a permanent, reproducible
      # spec, not a draft. Each was deliberately left unpinned during
      # resolution rather than reusing the old x86_64 pins verbatim.
      - torch==2.13.0          # was 2.2.2 (x86_64-only build). Confirmed
                                #   working: MPS available, tensor creation
                                #   on mps:0 succeeds (see report).
      - lightning==2.6.5       # was 2.6.5 -- resolved to the same version.
      - pytorch-lightning==2.6.5   # was 2.6.5 -- resolved to the same version.
      - torchmetrics==1.9.0    # was 1.9.0 -- not called out explicitly in the
                                #   task, but transitively version-locked to
                                #   torch/lightning; treated the same way as
                                #   those. Resolved to the same version.
      - chemprop==2.3.1        # was 2.3.1 -- resolved to the same version.
                                #   Installs and imports cleanly, but see the
                                #   report: training with --accelerator mps
                                #   fails (scatter_reduce_mps has no
                                #   deterministic kernel, and chemprop always
                                #   enables deterministic algorithms when a
                                #   pytorch-seed is set, which this project's
                                #   convention requires). CPU-only remains the
                                #   only working accelerator for Chemprop.
      - xgboost==3.2.0         # was 3.2.0 -- resolved to the same version.
      - lightgbm==4.7.0        # was 4.7.0 -- resolved to the same version.
      # RDKit: CHANGED from the exact old pin (2025.9.3) to 2026.3.3 -- an
      # explicit, user-confirmed decision, not a silent substitution. The old
      # pin is no longer installable at all: chemprop's only currently-
      # available releases (2.3.1, 2.3.0, 2.2.4 -- pip tried all three) hard-
      # depend on cuik_molmaker_pin, whose only remaining PyPI releases
      # (2026.3.3.post1/.post2/2026.3.4/2026.3.5) hard-require rdkit==2026.3.3
      # exactly. The cuik-molmaker-pin release that matched rdkit==2025.9.3
      # has been removed from PyPI entirely (confirmed live -- not an
      # arm64-specific gap; a fresh install on any platform hits this today).
      # Flagged to the user as a real conflict rather than resolved
      # unilaterally; user chose to move RDKit forward rather than pin
      # chemprop backward or bypass the dependency check.
      # CONSEQUENCE THIS MUST NOT BE TRUSTED WITHOUT VERIFYING: RDKit version
      # changes can alter canonicalisation/fingerprint output, and everything
      # already curated (train_inhibition_curated.csv, cv_folds.csv, frozen
      # feature sets) was generated under 2025.9.3 -- see the determinism
      # check this environment.yml was built to be tested against before
      # trusting it (BLOCKED in this duplicate repo -- see report: the
      # curated CSV this check needs doesn't exist here).
      # Pinned exactly here (not left free) for the same reason as
      # cuik-molmaker-pin below: leaving it free let pip resolve whatever
      # rdkit release it liked (2026.3.5, pulled in by the newest
      # cuik-molmaker-pin), which is a *different* number than what was
      # actually agreed to. 2026.3.3 is pip's version string for the same
      # release conda-forge calls 2026.03.3.
      - rdkit==2026.3.3
