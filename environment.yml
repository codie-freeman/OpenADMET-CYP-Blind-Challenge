# cyp-admet-v2 — permanent, architecture-agnostic environment spec.
#
# Originally drafted with name: cyp-admet (architecture-agnostic, no "arm64"/
# "m3", since this is intended to also run on a cloud VM later on a possibly
# different architecture again). Changed to cyp-admet-v2 on 2026-08-30, during
# migration into the real repo, so that `conda env create -f environment.yml`
# produces the same name as the already-built/verified environment on this
# machine and in this repo's docs, rather than silently creating a
# differently-named one. Fully pinned to versions actually confirmed installed
# and working in a real `conda env create` on native osx-arm64 (test env
# `cyp-admet-v2-test`, built with the native arm64 conda from
# ~/miniconda3-arm64, not the Intel /opt/anaconda3 one) -- not a loose draft.
#
# Source: environment_backup.yml (frozen export of the current, working
# x86_64/Rosetta cyp-admet env) plus README.md "Reproducing this work".
#
# THREE THINGS ANYONE USING THIS FILE MUST KNOW (see the full report for detail):
# 1. RDKit moved from 2025.9.3 to 2026.3.3 -- a user-approved, not silent,
#    change, forced by chemprop's dependency chain (see the pip-section
#    comment on the rdkit line). RDKit version changes can alter
#    canonicalisation/fingerprint output.
# 2. The determinism check this file was supposed to be validated against
#    (re-running canonical-SMILES/InChIKey generation against
#    train_inhibition_curated.csv and comparing to what's already stored)
#    could NOT be run -- that file does not exist in this duplicate repo
#    (data/processed/ was never generated here). This environment has NOT
#    been verified to reproduce the already-curated data's canonicalisation
#    output. Do not treat it as safe for feature-regeneration work against
#    the real repo until that check has actually run there.
# 3. Chemprop training with --accelerator mps fails (confirmed, reproducible):
#    scatter_reduce_mps has no deterministic kernel, and chemprop always
#    enables deterministic algorithms when a pytorch-seed is set (this
#    project's convention). CPU-only remains the only working path for
#    Chemprop/CheMeleon training, same conclusion as the old x86_64 env's
#    README note, though the underlying reason has changed (the op is no
#    longer literally unimplemented on MPS -- it's implemented but
#    non-deterministic, and chemprop's CLI exposes no way to relax that).
name: cyp-admet-v2
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.13
  # numpy pinned <2 deliberately (exact current pin carried forward) -- matches
  # the same caution reflected in Antonio de la Vega de León's requirements.txt
  # for this stack. Confirmed below (comment near pip section) that this does
  # not force an incompatible numpy on torch/lightning/scikit-learn/xgboost/
  # lightgbm/chemprop at the versions actually resolved.
  - numpy=1.26.4
  # RDKit is installed via pip, NOT here -- see the pip section below.
  # (First draft of this file put it here on conda-forge, reasoning it would
  # help the OpenMP conflict described in README's "Hardware constraint".
  # That broke at runtime: cuik_molmaker's compiled extension looks for
  # RDKit's shared libraries at a path that only exists in pip's wheel layout
  # (`../rdkit/.dylibs/libRDKitAbbreviations.1.dylib`) -- conda-forge's rdkit
  # doesn't lay out its libraries that way, so `import chemprop` failed with
  # a dlopen error. Discovered by actually running chemprop, not anticipated
  # in advance. Reverted to pip to match what chemprop's dependency chain
  # actually expects; see the pip-section comment for the version decision.)
  # scikit-learn: exact current pin carried forward -- confirmed live via pip
  # index that 1.9.0 is still the current latest release too, so "let this
  # resolve to whatever's needed" and "keep the current pin" land on the same
  # version. No compromise.
  - scikit-learn=1.9.0
  - statsmodels=0.14.6
